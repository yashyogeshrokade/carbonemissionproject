<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forecast Energy Consumption</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans">
  <!-- Header -->
  <div class="bg-red-800 text-white text-3xl font-bold text-center py-4">
    Energy Forecast Tool
  </div>

  <!-- Main Form Card -->
  <div class="max-w-xl mx-auto mt-12 bg-white p-10 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-semibold text-red-800 mb-6 text-center">
      Enter Conditions to Predict Energy Consumption
    </h2>

    <form id="forecastForm" class="space-y-6">
      <div>
        <label for="temperature" class="block text-lg font-medium text-gray-700">Temperature (°C)</label>
        <input id="temperature" type="number" step="0.1" required
          class="w-full mt-2 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none" />
      </div>

      <div>
        <label for="humidity" class="block text-lg font-medium text-gray-700">Humidity (%)</label>
        <input id="humidity" type="number" step="0.1" required
          class="w-full mt-2 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none" />
      </div>

      <button type="submit"
        class="w-full bg-red-800 hover:bg-red-700 text-white font-semibold py-2 rounded-lg shadow-md transition">
        Predict Energy
      </button>
    </form>

    <p id="result" class="mt-6 text-center text-xl font-semibold text-gray-800"></p>

    <div class="flex justify-center mt-8">
      <button onclick="goBack()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded-lg">
        ← Back
      </button>
    </div>
  </div>

  <script>
    function goBack() {
      window.location.href = 'details.html';
    }

    const API_URL = "https://energy-backend-ie4o.onrender.com/predict";

    document.getElementById("forecastForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const temperature = parseFloat(document.getElementById("temperature").value);
      const humidity = parseFloat(document.getElementById("humidity").value);
      const buildingType = new URLSearchParams(window.location.search).get("type") || "educational";

      const payload = {
        temperature,
        humidity,
        AC: 1,
        Labs: 0,
        AHU: 0,
        Servers: 1,
        building_type: buildingType
      };

      document.getElementById("result").innerText = "Predicting...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById("result").innerText =
            `Predicted Energy Consumption: ${data.predicted_energy.toFixed(2)} kWh`;
        } else {
          document.getElementById("result").innerText = "Error: " + data.error;
        }
      } catch (err) {
        document.getElementById("result").innerText = "Network Error: " + err.message;
      }
    });
  </script>
</body>
</html>
